# Starting point for deploying the Enterprise Voice Assistant.
#
# Four services: the FastAPI backend (private), Caddy (public entrypoint that
# serves the SPA, terminates TLS, and sets the strict CSP + security headers),
# PostgreSQL (persistent data + Alembic-managed schema) and Redis (live session
# state + shared atomic rate limiting).
#
# Adapt the domain, ports, and secret injection to your environment before use.
# Put your real secrets in .env at the repo root (gitignored) or your secret
# store; never bake them into this file. In production, point the api service
# at managed databases (e.g. RDS + ElastiCache) via DATABASE_URL / REDIS_URL
# instead of these containers.

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://evoa:${POSTGRES_PASSWORD:-change-me}@postgres:5432/assistant
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Internal only; Caddy is the sole public entrypoint.
    expose:
      - "8000"
    volumes:
      - api-data:/srv/data
    networks:
      - internal

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evoa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: assistant
    expose:
      - "5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evoa -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No persistence: session/rate-limit state is ephemeral by design (the
    # durable record lives in PostgreSQL and is rebuilt on cache loss).
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Serve the pre-built SPA: run (cd frontend && npm run build) first.
      - ../frontend/dist:/srv/frontend/dist:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

volumes:
  api-data:
  caddy-data:
  caddy-config:
  pg-data:

networks:
  internal:
